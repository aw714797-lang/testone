name: Pull Request Quality Checks
on:
  push:
    branches: main
  pull_request:
    types: [opened, synchronize]

job:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup language
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: npm install

      - name: Run linter
        run: npm run lint
      
      - name: Run test
        run: npm test

